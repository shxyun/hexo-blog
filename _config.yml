# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Shen Lijun's Study Notes
subtitle: 'study.shenlijun.cn'
description: 'Resource sharing and learning notes'
keywords:
author: Shen Lijun
timezone: 'Asia/Shanghai'

# URL
url: https://study.shenlijun.cn
root: /
permalink: :lang/:year/:month/:day/:title/
permalink_defaults:
  lang: en
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :lang/:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# i18n 生成器（hexo-generator-plus）：按语言生成首页/归档/分类/标签页
generator_plus:
  language: ['en', 'zh-CN']
  pagination_dir: 'page'
  generator: ["index", "archive", "category", "tag"]

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: next

# Language Settings - 多语言配置
language:
  - en
  - zh-CN

# Deployment
deploy:
  type: ''
