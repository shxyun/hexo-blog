# NexT Theme Config for study.shenlijun.cn

# Scheme
scheme: Gemini
darkmode: true

# Menu
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  about: /about/ || fa fa-user
  中文: /zh-CN/ || fa fa-language

menu_settings:
  icons: true
  badges: true

# 自定义注入：菜单链接跟随语言
custom_file_path:
  bodyEnd: source/_data/body-end.njk

# Sidebar
sidebar:
  position: left
  display: post

site_state: true

# Social Links
social:
  email: mailto:study@shenlijun.cn || fa fa-envelope
  github: https://github.com/shxyun || fab fa-github

# Footer
footer:
  copyright: true

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# Creative Commons
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: true
  post: true

# Favicon
favicon:
  small: /favicon.svg
  medium: /favicon.svg
  apple_touch_icon: /favicon.svg

# Post Edit Link
post_edit:
  enable: true
  url: https://github.com/shxyun/hexo-blog/edit/main/source/_posts/

# Comments - Giscus
comments:
  active: giscus
  giscus:
    repo: shxyun/hexo-blog
    repo_id: R_kgDOU7Imxg
    category: Announcements
    category_id: DIC_kwDOU7Imxs4DHeYC
    reactions_enabled: 1
    position: top
    input_position: bottom
    light_theme: light
    dark_theme: dark
    lang: en

